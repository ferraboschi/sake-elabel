name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install

      - name: Build
        run: npm run build
        # Every VITE_* value is inlined into the PUBLIC JS bundle.
        # Never add API tokens or passwords here — writes go through the
        # proxy workers, which hold the real credentials server-side.
        env:
          VITE_AIRTABLE_PROXY_URL: ${{ secrets.VITE_AIRTABLE_PROXY_URL }}
          VITE_AIRTABLE_BASE_ID: ${{ secrets.VITE_AIRTABLE_BASE_ID }}
          VITE_SHOPIFY_STORE: ${{ secrets.VITE_SHOPIFY_STORE }}
          VITE_SHOPIFY_PROXY: ${{ secrets.VITE_SHOPIFY_PROXY }}
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_PARTNER_PASSWORD: ${{ secrets.VITE_PARTNER_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

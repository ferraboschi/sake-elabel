    <!-- NO external stylesheets, NO tracking scripts, NO analytics -->
    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var restored = decodeURIComponent(p) + (q ? '?' + decodeURIComponent(q) : '') + window.location.hash;
          window.history.replaceState(null, null, restored);
        }
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- Background -->
  <rect width="120" height="140" fill="white"/>

  <!-- Möbius Loop (Three Recycling Arrows) -->
  <g transform="translate(60, 45)">
    <!-- Arrow 1 (top) -->
    <path d="M 0,-25 Q 15,-18 18,-8 L 22,-10 Q 18,-22 0,-30 Q -18,-22 -22,-10 L -18,-8 Q -15,-18 0,-25" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="22,-10 18,-8 25,-5" fill="black"/>

    <!-- Arrow 2 (bottom-right) -->
    <path d="M 21.6,14 Q 10,18 0,16 L 2,22 Q 16,25 28,18 Q 24,2 21.6,14" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="2,22 0,16 -2,23" fill="black"/>

    <!-- Arrow 3 (bottom-left) -->
    <path d="M -21.6,14 Q -10,18 0,16 L -2,22 Q -16,25 -28,18 Q -24,2 -21.6,14" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="-2,22 0,16 2,23" fill="black"/>
  </g>

  <!-- Material Code Number -->
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="black">20</text>

  <!-- Material Abbreviation -->
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="black">PAP</text>
</svg>